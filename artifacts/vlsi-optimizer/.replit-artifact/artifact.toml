kind = "web"
previewPath = "/"
title = "AI VLSI PPA Optimizer"
description = "An interactive RTL design-space exploration dashboard that predicts power, energy, area and timing for parameterized digital VLSI circuits, flags budget violations, and recommends Pareto-optimal configurations."
version = "1.0.0"
id = "artifacts/vlsi-optimizer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21351

[services.development]
run = "pnpm --filter @workspace/vlsi-optimizer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vlsi-optimizer", "run", "build" ]
serve = "static"
publicDir = "artifacts/vlsi-optimizer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21351"
BASE_PATH = "/"
